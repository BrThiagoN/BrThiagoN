name: Update profile dashboard

on:
  schedule:
    - cron: '23 9 * * *' # 06:23 em São Paulo (UTC-3).
  workflow_dispatch:
  push:
    branches: [main, 'feat/profile-*']
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-profile.yml'
      - 'assets/development-mark.svg'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - 'README.md'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-dashboard-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test data handling and SVG compatibility
        run: python -m unittest discover -s tests -v
      - name: Verify reproducible assets
        run: python scripts/generate_dashboard.py --offline --check

  update:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.repository == 'BrThiagoN/BrThiagoN'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Necessário apenas neste job para versionar os assets gerados.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          # O checkout guarda a credencial temporária e a remove no post-job.
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Generate dashboard from GitHub APIs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_dashboard.py
      - name: Validate generated assets
        run: python scripts/generate_dashboard.py --offline --check
      - name: Commit only changed profile assets
        env:
          PROFILE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -- assets/dashboard.svg assets/dashboard-mobile.svg assets/profile-data.json assets/avatar.jpg assets/footer/*.svg
          if git diff --cached --quiet; then
            echo "Profile assets unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): update dashboard'
          git push origin "HEAD:refs/heads/${PROFILE_BRANCH}"
