<svg xmlns="http://www.w3.org/2000/svg" width="880" height="48" viewBox="0 0 880 48" role="img" aria-labelledby="title description">
<title id="title">$ contact</title>
<desc id="description">$ contact</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
.display{font-family:"Bahnschrift","DIN Condensed","Nimbus Sans Narrow","Arial Narrow","Liberation Sans Narrow",sans-serif;font-weight:700}
.strong{font-weight:700}
text{fill:#f3ece8}
.muted{fill:#a5a1ad}
.accent,.accent-fill{fill:#f05c73}
.pink{fill:#ef8fb4}
.rule{stroke:#3d3342}
.mark-outline{stroke:#803044}
.level-0{fill:#1e1b26}
.level-1{fill:#482437}
.level-2{fill:#7b304c}
.level-3{fill:#bf4b76}
.level-4{fill:#ef8fb4}
.stack-scan{stroke:#ef8fb4}
.handwriting-line{stroke:#f3ece8}
.handwriting-line.muted{stroke:#a5a1ad}
.handwriting-line.pink{stroke:#ef8fb4}
@media (prefers-color-scheme: light){
text{fill:#24292f}
.muted{fill:#59636e}
.accent,.accent-fill{fill:#b91f45}
.pink{fill:#96335f}
.rule{stroke:#d1d9e0}
.mark-outline{stroke:#dba7b6}
.level-0{fill:#ebe8ee}
.level-1{fill:#efc9d8}
.level-2{fill:#d990af}
.level-3{fill:#b9507e}
.level-4{fill:#832044}
.stack-scan{stroke:#96335f}
.handwriting-line{stroke:#24292f}
.handwriting-line.muted{stroke:#59636e}
.handwriting-line.pink{stroke:#96335f}
}
.handwriting-letter{stroke-opacity:0;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: no-preference){
.contribution-cell{animation:contribution-wave 900ms cubic-bezier(.2,.65,.3,1) both;transform-box:fill-box;transform-origin:center}
.contribution-ripple{animation:contribution-ripple 4800ms ease-in-out infinite}
.handwriting-letter{animation-name:handwriting-ink;animation-timing-function:linear;animation-fill-mode:both;stroke-width:.025em;stroke-dasharray:8em}
.decode-final{animation:decode-resolved 900ms step-end 100ms both}
.decode-frame{animation-duration:900ms;animation-delay:100ms;animation-timing-function:step-end;animation-fill-mode:both}
.decode-frame-0{animation-name:decode-stage-0}
.decode-frame-1{animation-name:decode-stage-1}
.decode-frame-2{animation-name:decode-stage-2}
.divider{stroke-dasharray:1;animation:divider-draw 900ms cubic-bezier(.4,0,.2,1) 120ms both}
.stack-aperture{transform-box:view-box;animation:stack-reveal 1800ms steps(18,end) both}
.stack-scan{animation:stack-register 1800ms steps(18,end) forwards}
.seal-final{animation:decode-resolved 950ms step-end both}
.seal-pieces{animation:seal-pieces 950ms step-end both}
.seal-fragment{animation:seal-fragment 220ms ease-out both}
}
@keyframes contribution-wave{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes contribution-ripple{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-2px)}75%{transform:translateY(2px)}}
@keyframes handwriting-ink{0%{fill-opacity:0;stroke-opacity:1;stroke-dashoffset:8em}70%{fill-opacity:0;stroke-opacity:1;stroke-dashoffset:0}100%{fill-opacity:1;stroke-opacity:0;stroke-dashoffset:0}}
@keyframes decode-resolved{from{opacity:0}to{opacity:1}}
@keyframes decode-stage-0{0%{opacity:1}33.333%{opacity:0}100%{opacity:0}}
@keyframes decode-stage-1{0%{opacity:0}33.333%{opacity:1}66.667%{opacity:0}100%{opacity:0}}
@keyframes decode-stage-2{0%{opacity:0}66.667%{opacity:1}100%{opacity:0}}
@keyframes divider-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes stack-reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes stack-register{0%{opacity:1;transform:translateX(0)}99%{opacity:1}100%{opacity:0;transform:translateX(var(--scan-width))}}
@keyframes seal-pieces{from{opacity:1}to{opacity:0}}
@keyframes seal-fragment{from{opacity:0}to{opacity:1}}
</style>
<g data-panel="heading" data-bounds="0 0 880 48">
<g data-command="$ contact">
<g class="decode-frame decode-frame-0" opacity="0" aria-hidden="true">
<text x="24" y="32" font-size="18" fill="#a5a1ad" class="muted" text-anchor="start">$ c_01#_0</text>
</g>
<g class="decode-frame decode-frame-1" opacity="0" aria-hidden="true">
<text x="24" y="32" font-size="18" fill="#a5a1ad" class="muted" text-anchor="start">$ con#_01</text>
</g>
<g class="decode-frame decode-frame-2" opacity="0" aria-hidden="true">
<text x="24" y="32" font-size="18" fill="#a5a1ad" class="muted" text-anchor="start">$ conta1#</text>
</g>
<g class="decode-final">
<text x="24" y="32" font-size="18" fill="#f05c73" class="accent" text-anchor="start">$ contact</text>
</g></g>
</g>
</svg>
